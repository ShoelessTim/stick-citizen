<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stick Citizen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 640'%3E%3Cpolygon points='320,20 580,170 580,470 320,620 60,470 60,170' fill='%23121A22' stroke='%23F0A43A' stroke-width='40'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css?v=3.7.1">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 640 640" aria-hidden="true">
        <polygon points="320,20 580,170 580,470 320,620 60,470 60,170" fill="#121A22" stroke="#F0A43A" stroke-width="40" stroke-linejoin="round"/>
        <g fill="#E8ECF1"><rect x="127" y="404" width="166" height="62" rx="8"/><path d="M200 404L226 286L250 290L224 404Z"/><rect x="192" y="250" width="112" height="46" rx="16" transform="rotate(12 248 273)"/></g>
        <g fill="#F0A43A"><path d="M350 466L508 466L484 424L375 424Z"/><rect x="398" y="392" width="62" height="34" rx="4"/><path d="M384 240L446 234L460 396L404 396L396 330L392 270Z"/><rect x="370" y="198" width="86" height="56" rx="20" transform="rotate(-6 413 226)"/></g>
      </svg>
      <span class="word"><b>STICK</b><i>CITIZEN</i></span>
    </div>
    <nav class="seg pill" id="views" aria-label="View">
      <button data-view="sticks" class="on">Sticks</button>
      <button data-view="edit">Edit</button>
      <button data-view="fly">Fly</button>
    </nav>
    <div class="right">
      <div class="seg" id="stickTabs" role="tablist" aria-label="Stick"></div>
      <button class="icon" id="btnLayouts" title="Start from a layout" aria-label="Start from a layout">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
      <button class="icon" id="btnOpen" title="Open bindings (actionmaps.xml or a layout)" aria-label="Open bindings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg></button>
      <button class="icon" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button class="icon" id="btnVoice" title="Spoken callouts" aria-label="Spoken callouts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="wave" d="M16 8a5 5 0 010 8M19 5a9 9 0 010 14"/></svg></button>
      <button class="primary" id="btnSave">Save for Star Citizen</button>
    </div>
  </header>

  <div class="bar">
    <div class="modes" id="modes"><span class="lbl">MODE</span></div>
    <div class="hint" id="hint"></div>
  </div>

  <main id="stageWrap">
    <div id="stage">
      <svg id="lines" aria-hidden="true"></svg>
    </div>
    <div id="empty" class="empty" hidden></div>
  </main>

  <section id="others" class="others" hidden>
    <button class="others-head" id="othersHead" aria-expanded="false"></button>
    <div class="others-body" id="othersBody"></div>
  </section>

  <footer class="foot">
    <span class="live-tag">LIVE</span>
    <span class="live" id="live">Press anything on your sticks</span>
    <span class="live-sub" id="liveSub"></span>
    <div class="meters" id="meters"></div>
  </footer>

  <div id="wizard" class="wizard" hidden></div>
  <aside id="drawer" class="drawer" hidden></aside>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
</div>
<script src="app.js?v=3.7.1"></script>
</body>
</html>
