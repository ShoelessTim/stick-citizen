name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest -q
      - name: Build
        run: pyinstaller --onefile --windowed --name StickCitizen run_stick_citizen.py
      - uses: actions/upload-artifact@v4
        with:
          name: StickCitizen
          path: dist/StickCitizen.exe
      - name: Release (tagged versions)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StickCitizen.exe
      - name: Release (latest from main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/StickCitizen.exe --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Built from main at ${GITHUB_SHA::7}. Download StickCitizen.exe below." --prerelease
