name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:          # every PR gets a test build (exe + installer) under Actions → the run → Artifacts
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Version
        id: ver
        shell: bash
        run: |
          VER="v$(python -c 'import stick_citizen; print(stick_citizen.__version__)')"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "exe=StickCitizen-$VER.exe" >> "$GITHUB_OUTPUT"
          echo "num=${VER#v}" >> "$GITHUB_OUTPUT"
          echo "setup=StickCitizen-$VER-Setup.exe" >> "$GITHUB_OUTPUT"
          python tools/make_version_file.py version_info.txt
      - name: Build
        run: pyinstaller --onefile --windowed --name "StickCitizen-${{ steps.ver.outputs.ver }}" --version-file version_info.txt --icon assets/icon.ico --add-data "stick_citizen/data;stick_citizen/data" --add-data "stick_citizen/web;stick_citizen/web" --collect-all webview run_stick_citizen.py
      - name: Installer (Start Menu + desktop icon)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.num }}" "/DSourceExe=..\dist\${{ steps.ver.outputs.exe }}" installer\stick-citizen.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: StickCitizen-${{ steps.ver.outputs.ver }}
          path: |
            dist/${{ steps.ver.outputs.exe }}
            dist/${{ steps.ver.outputs.setup }}
      - name: Versioned release (when stick_citizen.__version__ is new)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
          EXE: ${{ steps.ver.outputs.exe }}
          SETUP: ${{ steps.ver.outputs.setup }}
        run: |
          if gh release view "$VER" >/dev/null 2>&1; then echo "$VER already released"; exit 0; fi
          mkdir -p "pkg/StickCitizen-$VER"
          cp "dist/$EXE" README.md LICENSE "pkg/StickCitizen-$VER/"
          (cd pkg && 7z a "../dist/StickCitizen-$VER.zip" "StickCitizen-$VER" >/dev/null)
          gh release create "$VER" "dist/$SETUP" "dist/$EXE" "dist/StickCitizen-$VER.zip" --target "$GITHUB_SHA" \
            --title "Stick Citizen $VER" --latest --notes "**Download $SETUP** below and run it: it installs Stick Citizen with a Start Menu and desktop icon (no admin needed). Prefer no install? $EXE runs on its own. Your setup is kept in %APPDATA%\\StickCitizen, so newer versions pick it up."
      - name: Release (latest from main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
          EXE: ${{ steps.ver.outputs.exe }}
        run: |
          DEV="StickCitizen-$VER-dev-${GITHUB_SHA::7}.exe"
          cp "dist/$EXE" "dist/$DEV"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "dist/$DEV" --target "$GITHUB_SHA" \
            --title "Dev build (main)" --notes "Untested dev build from main at ${GITHUB_SHA::7}. Download $DEV below." --prerelease --latest=false
