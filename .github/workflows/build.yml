name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build
        run: pyinstaller --onefile --windowed --name StickCitizen --add-data "stick_citizen/data;stick_citizen/data" run_stick_citizen.py
      - uses: actions/upload-artifact@v4
        with:
          name: StickCitizen
          path: dist/StickCitizen.exe
      - name: Versioned release (when stick_citizen.__version__ is new)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(python -c 'import stick_citizen; print(stick_citizen.__version__)')"
          if gh release view "$VER" >/dev/null 2>&1; then echo "$VER already released"; exit 0; fi
          mkdir -p pkg/StickCitizen/templates
          cp dist/StickCitizen.exe README.md LICENSE pkg/StickCitizen/
          (cd pkg && 7z a "../dist/StickCitizen-$VER.zip" StickCitizen >/dev/null)
          gh release create "$VER" dist/StickCitizen.exe "dist/StickCitizen-$VER.zip" --target "$GITHUB_SHA" \
            --title "Stick Citizen $VER" --latest --notes "**Download StickCitizen.exe** below and double-click it (Windows, no install). The zip has the exe, README and an empty templates folder."
      - name: Release (latest from main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/StickCitizen.exe --target "$GITHUB_SHA" \
            --title "Dev build (main)" --notes "Untested dev build from main at ${GITHUB_SHA::7}. Download StickCitizen.exe below." --prerelease --latest=false
