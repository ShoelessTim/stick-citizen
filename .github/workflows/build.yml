name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build
        run: pyinstaller --onefile --windowed --name StickCitizen --add-data "stick_citizen/data;stick_citizen/data" run_stick_citizen.py
      - uses: actions/upload-artifact@v4
        with:
          name: StickCitizen
          path: dist/StickCitizen.exe
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/StickCitizen/templates | Out-Null
          Copy-Item dist/StickCitizen.exe, README.md, LICENSE pkg/StickCitizen/
          Compress-Archive -Path pkg/StickCitizen -DestinationPath "dist/StickCitizen-${{ github.ref_name }}.zip"
      - name: Release (tagged versions)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Stick Citizen ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          body: |
            **Download `StickCitizen.exe`** below and double-click it (Windows, no install).
            Or grab the zip for the exe plus README and an empty `templates` folder.
          files: |
            dist/StickCitizen.exe
            dist/StickCitizen-${{ github.ref_name }}.zip
      - name: Release (latest from main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/StickCitizen.exe --target "$GITHUB_SHA" \
            --title "Dev build (main)" --notes "Untested dev build from main at ${GITHUB_SHA::7}. Download StickCitizen.exe below." --prerelease --latest=false
